[build-system]
requires = ["uv_build==0.12.0"]
build-backend = "uv_build"

[project]
name = "triana-labs"
version = "0.0.0"
description = "Local-first behavioral evidence for conversational agents"
requires-python = "==3.13.14"
dependencies = [
    "langchain==1.3.14",
    "langchain-openai==1.4.0",
    "langgraph==1.2.9",
    "pydantic>=2,<3",
]

[project.scripts]
triana = "triana_labs.cli:main"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "triana_labs"
module-root = "src"

[tool.mypy]
python_version = "3.13"
strict = true

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]
