[build-system]
requires = ["uv_build==0.12.0"]
build-backend = "uv_build"

[project]
name = "triana"
version = "0.0.0"
description = "Deterministic release-evidence contracts for conversational agents"
requires-python = "==3.13.14"
license = "LicenseRef-Proprietary"
dependencies = [
    "pydantic>=2,<3",
]

[project.scripts]
triana = "triana.cli:main"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "triana"
module-root = "src"

[tool.mypy]
python_version = "3.13"
strict = true

[dependency-groups]
dev = [
    "hypothesis>=6,<7",
    "mypy>=1,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]
