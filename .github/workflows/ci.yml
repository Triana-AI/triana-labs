name: Verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: ./scripts/verify-governance.sh --working-tree
      - run: ./ops/verify-deployment-assets.sh
      - run: ./ops/verify-no-secrets.sh

  labs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: ./triana-labs/scripts/verify.sh

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: triana-backend
    env:
      UV_PYTHON: "3.13.14"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check uv==0.8.14
      - run: uv python install 3.13.14
      - run: uv sync --frozen --dev
      - run: uv run ruff check src migrations
      - run: uv run ruff check tests --ignore E402,S101,S603,S607,S608
      - run: uv run ruff format --check src tests migrations
      - run: uv run mypy src/triana_backend --strict
      - run: uv run pytest -q tests/acceptance/test_labs08_p0_reconciliation.py::test_first_alembic_bootstrap_creates_schema_before_version_table
      - run: uv run pytest --collect-only --quiet

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: triana-app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run verify:local

  arm64-images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: docker build --file triana-backend/Dockerfile --tag triana-backend:verify .
      - run: docker build --file triana-app/Dockerfile --tag triana-app:verify triana-app
