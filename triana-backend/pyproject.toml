[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "triana-backend"
version = "0.1.0"
description = "Private backend for the bounded Triana Labs HRAI demo"
requires-python = "==3.13.14"
dependencies = [
  "alembic>=1.16,<2",
  "boto3>=1.40,<2",
  "dbos==2.27.0",
  "fastapi==0.139.2",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.13.4",
  "sqlalchemy>=2.0,<3",
  "triana-labs",
  "uvicorn==0.51.0",
]

[project.scripts]
triana = "triana_backend.cli:main"
triana-backend = "triana_backend.main:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-boto3[s3]>=1.40,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/triana_backend"]

[tool.uv.sources]
triana-labs = { path = "../triana-labs", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["triana_backend"]
