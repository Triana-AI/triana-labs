[build-system]
requires = ["uv_build==0.12.0"]
build-backend = "uv_build"

[project]
name = "triana-preview"
version = "0.1.0a1"
description = "Private local packaging for the Triana Labs Behavior Map"
requires-python = "==3.13.14"
dependencies = ["triana-labs"]

[project.scripts]
triana-preview = "triana_preview.cli:main"

[tool.uv]
package = true

[tool.uv.sources]
triana-labs = { path = "../triana-labs" }

[tool.uv.build-backend]
module-name = "triana_preview"
module-root = "src"

[tool.mypy]
python_version = "3.13"
strict = true

[dependency-groups]
dev = [
    "mypy>=1,<2",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]
